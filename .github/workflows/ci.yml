name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  frontend-build:
    name: Frontend build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

  frontend-test:
    name: Frontend tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm run test:frontend

  rust-test:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

  rust-clippy:
    name: Rust Clippy
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  checks:
    name: Required checks
    runs-on: windows-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - format
      - frontend-build
      - frontend-test
      - rust-test
      - rust-clippy

    env:
      FORMAT_RESULT: ${{ needs.format.result }}
      FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
      FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
      RUST_TEST_RESULT: ${{ needs.rust-test.result }}
      RUST_CLIPPY_RESULT: ${{ needs.rust-clippy.result }}

    steps:
      - name: Verify required jobs
        shell: pwsh
        run: |
          $results = @(
            "format=$env:FORMAT_RESULT",
            "frontend-build=$env:FRONTEND_BUILD_RESULT",
            "frontend-test=$env:FRONTEND_TEST_RESULT",
            "rust-test=$env:RUST_TEST_RESULT",
            "rust-clippy=$env:RUST_CLIPPY_RESULT"
          )
          $failed = $results | Where-Object { $_ -notmatch '=success$' }
          if ($failed) {
            Write-Error ("Required CI jobs did not succeed: " + ($failed -join ', '))
            exit 1
          }
